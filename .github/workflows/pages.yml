# Kotisivu (site/) ja verkkoversio (Flutter web, /app/) GitHub Pagesiin.
# Käyttöönotto: Settings → Pages → Source: GitHub Actions.
# Toiminnot lukittu tarkkoihin versioihin (commit-tunniste); päivitys: vaihda tunniste ja versiokommentti.
name: Kotisivu ja verkkoversio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # versionumero lasketaan git-historiasta (tools/version.py)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - name: Verkkoversio
        run: flutter build web --release --no-web-resources-cdn --base-href /gievra/app/ $(python3 tools/version.py --flutter)
      - name: Kotisivu
        run: |
          mkdir -p public/kuvat/en public/en
          cp site/index.html site/kartat.json site/kartat-tarkisteet.json site/kartat.js site/gievra-video*.mp4 site/gievra-video*.jpg public/
          cp site/en/index.html public/en/
          cp assets/logo_icon.png public/logo.png
          cp docs/screenshots/*.png public/kuvat/
          cp docs/screenshots/en/*.png public/kuvat/en/
          cp -r build/web public/app
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
