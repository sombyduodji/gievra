# Kotisivu (site/) ja verkkoversio (Flutter web, /app/) GitHub Pagesiin.
# Käyttöönotto: Settings → Pages → Source: GitHub Actions.
name: Kotisivu ja verkkoversio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionumero lasketaan git-historiasta (tools/version.py)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - name: Verkkoversio
        run: flutter build web --release --no-web-resources-cdn --base-href /gievra/app/ $(python3 tools/version.py --flutter)
      - name: Kotisivu
        run: |
          mkdir -p public/kuvat/en public/en
          cp site/index.html site/gievra-video*.mp4 site/gievra-video*.jpg public/
          cp site/en/index.html public/en/
          cp assets/logo_icon.png public/logo.png
          cp docs/screenshots/*.png public/kuvat/
          cp docs/screenshots/en/*.png public/kuvat/en/
          cp -r build/web public/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
